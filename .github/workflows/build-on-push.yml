name: Build on Push (Development)

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          CI: false
      
      - name: Clean build directories
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path build) { Remove-Item -Recurse -Force build }
        shell: pwsh
      
      - name: Build Windows executable
        run: python scripts/build_windows.py
        shell: pwsh
      
      - name: Verify no user data in build
        run: |
          $dataFiles = Get-ChildItem -Path dist/PepiniereValbray -Recurse -Include "recoltes.db","recoltes_fraises.xlsx","last_runs.json","model_fraises_v2.pkl" -ErrorAction SilentlyContinue
          if ($dataFiles) {
            Write-Host "❌ ERREUR: Fichiers de données utilisateur trouvés dans le build:"
            $dataFiles | ForEach-Object { Write-Host "  - $($_.FullName)" }
            exit 1
          } else {
            Write-Host "✅ Aucun fichier de données utilisateur dans le build"
          }
        shell: pwsh
      
      - name: Create Windows ZIP archive
        run: |
          cd dist
          Compress-Archive -Path PepiniereValbray -DestinationPath PepiniereValbray-Windows.zip -Force
      
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable-${{ github.sha }}
          path: dist/PepiniereValbray/
          retention-days: 7
      
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip-${{ github.sha }}
          path: dist/PepiniereValbray-Windows.zip
          retention-days: 7

  build-macos:
    name: Build macOS Application
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          CI: false
      
      - name: Clean build directories
        run: |
          rm -rf dist build
      
      - name: Build macOS application
        run: python scripts/build_macos.py
      
      - name: Verify no user data in build
        run: |
          if find dist/PepiniereValbray.app -name "recoltes.db" -o -name "recoltes_fraises.xlsx" -o -name "last_runs.json" -o -name "model_fraises_v2.pkl" 2>/dev/null | grep -q .; then
            echo "❌ ERREUR: Fichiers de données utilisateur trouvés dans le build:"
            find dist/PepiniereValbray.app -name "recoltes.db" -o -name "recoltes_fraises.xlsx" -o -name "last_runs.json" -o -name "model_fraises_v2.pkl" 2>/dev/null
            exit 1
          else
            echo "✅ Aucun fichier de données utilisateur dans le build"
          fi
      
      - name: Create macOS DMG
        run: |
          hdiutil create -volname "PepiniereValbray" \
            -srcfolder dist/PepiniereValbray.app \
            -ov -format UDZO \
            dist/PepiniereValbray-macOS.dmg || echo "DMG creation failed, continuing..."
      
      - name: Create macOS ZIP (for auto-update)
        run: |
          cd dist
          zip -r PepiniereValbray-macOS.zip PepiniereValbray.app || echo "ZIP creation failed, continuing..."
      
      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: macos-application-${{ github.sha }}
          path: dist/PepiniereValbray.app
          retention-days: 7
      
      - name: Upload macOS DMG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ github.sha }}
          path: dist/PepiniereValbray-macOS.dmg
          retention-days: 7
        continue-on-error: true
      
      - name: Upload macOS ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip-${{ github.sha }}
          path: dist/PepiniereValbray-macOS.zip
          retention-days: 7
        continue-on-error: true

  create-release:
    name: Create Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    # Créer une release uniquement pour les pushes sur main/master (pas pour les PR)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    permissions:
      contents: write  # Nécessaire pour créer des releases et des tags
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-zip-${{ github.sha }}
          path: ./artifacts
      
      - name: Download macOS ZIP
        uses: actions/download-artifact@v4
        with:
          name: macos-zip-${{ github.sha }}
          path: ./artifacts
        continue-on-error: true
      
      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-${{ github.sha }}
          path: ./artifacts
        continue-on-error: true
      
      - name: Download macOS App (fallback)
        uses: actions/download-artifact@v4
        with:
          name: macos-application-${{ github.sha }}
          path: ./artifacts
        continue-on-error: true
      
      - name: Generate version from commit
        id: version
        run: |
          # Utiliser la date et le SHA court pour créer une version unique
          DATE=$(date +'%Y%m%d')
          SHA_SHORT=${GITHUB_SHA:0:7}
          VERSION="${DATE}-${SHA_SHORT}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version générée: ${VERSION}"
      
      - name: Get commit message
        id: commit_msg
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          # Échapper les caractères spéciaux pour le body
          COMMIT_MSG="${COMMIT_MSG//$'\n'/'%0A'}"
          echo "COMMIT_MSG=${COMMIT_MSG}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.app
          fail_on_unmatched_files: false
          tag_name: "v${{ steps.version.outputs.VERSION }}"
          name: "Release ${{ steps.version.outputs.VERSION }}"
          body: |
            ## Pépinière Valbray - Build automatique
            
            **Version** : ${{ steps.version.outputs.VERSION }}
            **Commit** : ${{ github.sha }}
            **Date** : ${{ github.event.head_commit.timestamp }}
            
            ### Téléchargements
            
            - **Windows** : Téléchargez `PepiniereValbray-Windows.zip`, extrayez-le et lancez `PepiniereValbray.exe`
            - **macOS** : Téléchargez `PepiniereValbray-macOS.dmg` ou `PepiniereValbray.app`
            
            ### Installation
            
            1. Téléchargez le fichier correspondant à votre système
            2. Extrayez/Installez l'application
            3. Lancez l'application
            4. L'interface web s'ouvrira automatiquement dans votre navigateur
            
            ### Notes
            
            - Aucune installation de Python n'est nécessaire
            - L'application démarre un serveur web local sur http://127.0.0.1:5000
            - Les données sont stockées localement dans le dossier de l'application
            - Cette release est générée automatiquement à chaque push sur main
            
            ### Dernier commit
            
            ${{ steps.commit_msg.outputs.COMMIT_MSG }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

