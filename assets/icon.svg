<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond avec dégradé vert -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="strawberryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C62828;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond arrondi -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#bgGradient)"/>
  
  <!-- Feuilles (en arrière-plan) -->
  <g transform="translate(256, 200)">
    <!-- Feuille gauche -->
    <ellipse cx="-80" cy="0" rx="100" ry="140" fill="url(#leafGradient)" opacity="0.8" transform="rotate(-30)"/>
    <!-- Feuille droite -->
    <ellipse cx="80" cy="0" rx="100" ry="140" fill="url(#leafGradient)" opacity="0.8" transform="rotate(30)"/>
    <!-- Feuille centrale (en haut) -->
    <ellipse cx="0" cy="-60" rx="90" ry="120" fill="url(#leafGradient)" opacity="0.7" transform="rotate(0)"/>
  </g>
  
  <!-- Fraise principale -->
  <g transform="translate(256, 280)">
    <!-- Corps de la fraise -->
    <ellipse cx="0" cy="0" rx="90" ry="100" fill="url(#strawberryGradient)"/>
    
    <!-- Graines de la fraise -->
    <g fill="#FFEB3B" opacity="0.9">
      <circle cx="-50" cy="-30" r="4"/>
      <circle cx="-30" cy="-20" r="4"/>
      <circle cx="-20" cy="0" r="4"/>
      <circle cx="-35" cy="20" r="4"/>
      <circle cx="-50" cy="30" r="4"/>
      <circle cx="0" cy="-40" r="4"/>
      <circle cx="20" cy="-30" r="4"/>
      <circle cx="30" cy="-10" r="4"/>
      <circle cx="25" cy="15" r="4"/>
      <circle cx="10" cy="30" r="4"/>
      <circle cx="-10" cy="35" r="4"/>
      <circle cx="50" cy="-20" r="4"/>
      <circle cx="45" cy="5" r="4"/>
      <circle cx="40" cy="25" r="4"/>
    </g>
    
    <!-- Tige et feuille du haut -->
    <g transform="translate(0, -100)">
      <rect x="-8" y="0" width="16" height="40" fill="#4CAF50" rx="8"/>
      <ellipse cx="0" cy="-20" rx="30" ry="25" fill="url(#leafGradient)" transform="rotate(-20)"/>
    </g>
  </g>
  
  <!-- Texte "PV" en bas (optionnel, discret) -->
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" opacity="0.3" text-anchor="middle">PV</text>
</svg>

